<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSG Cafe - Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Vertical Navigation Panel -->
        <aside class="sidebar">
            <div class="logo"><h2>MSG Cafe</h2></div>
            <nav class="nav-links">
                <a href="{{ url_for('analytics') }}" class="nav-item">Analytics</a>
                <a href="{{ url_for('users') }}" class="nav-item">User Management</a>
                <a href="{{ url_for('orders') }}" class="nav-item">Orders</a>
                <a href="{{ url_for('payments') }}" class="nav-item">Payments</a>
            </nav>
            <div class="sidebar-bottom">
                <button id="settingsBtn" class="settings-btn">⚙️ Settings</button>
                <a href="{{ url_for('profile') }}" class="profile-link">
                    <div class="profile-badge">👤 MSG Admin</div>
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <input type="search" placeholder="Global search..." class="global-search">
            </header>
            
            <section class="content-body">
                {% block content %}{% endblock %}
            </section>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Settings</h3>
            <div class="form-group">
                <label>Theme:</label>
                <select id="themeSelector">
                    <option value="light">Light Mode</option>
                    <option value="dark">Dark Mode</option>
                </select>
            </div>
            <div class="form-group">
                <label>Document Export Format:</label>
                <select id="exportSelector">
                    <option value="pdf">PDF</option>
                    <option value="csv">CSV</option>
                </select>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
